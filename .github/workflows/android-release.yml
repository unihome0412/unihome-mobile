name: Android Release AAB (firmado)

on:
  workflow_dispatch:
    inputs:
      expected_version_code:
        description: "versionCode autorizado de app.json; debe coincidir exactamente"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-release:
    name: AAB release firmado (entorno protegido)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Comprobar rama, habilitación y secretos sin imprimir valores
        env:
          RELEASE_BUILD_ENABLED: ${{ vars.RELEASE_BUILD_ENABLED }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::El build firmado solo se permite desde main"
            exit 1
          }
          test "${RELEASE_BUILD_ENABLED}" = "true" || {
            echo "::error::Build firmado deshabilitado: configure RELEASE_BUILD_ENABLED=true y un environment protegido con autorización"
            exit 1
          }
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_UPLOAD_CERT_SHA256; do
            test -n "${!name}" || {
              echo "::error::Falta el secreto requerido ${name}"
              exit 1
            }
          done

      - name: Preparar Node fijado por .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Preparar JDK 17 para AGP 9
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Instalar plataforma 37, Build Tools 36 y NDK compatible
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.1.12297006"

      - name: Preparar caché de Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Instalar dependencias con lockfile
        run: npm ci --legacy-peer-deps

      - name: Generar proyecto Android con Expo CNG
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"

      - name: Inyectar configuración de firma en el Gradle generado
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/unihome-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs

      - name: Materializar keystore temporal desde el environment
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/unihome-upload.jks"
          test -s "${RUNNER_TEMP}/unihome-upload.jks"

      - name: Compilar AAB release firmado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/unihome-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verificar firma y certificado de carga autorizado
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -strict -certs "$AAB"
          ACTUAL="$(keytool -printcert -jarfile "$AAB" | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::El certificado del AAB no coincide con ANDROID_UPLOAD_CERT_SHA256"
            exit 1
          }

      - name: Descargar bundletool fijado y verificar manifiesto release
        run: |
          set -euo pipefail
          curl -sSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar" | sha256sum -c -
          java -jar bundletool.jar dump manifest \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab > release-manifest.xml
          node scripts/verify-android-manifest.mjs --manifest release-manifest.xml --profile release

      - name: Registrar SHA256, tamaño y metadatos del AAB
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/unihome-release.aab
          node scripts/verify-release-artifact.mjs \
            --aab artifacts/unihome-release.aab \
            --sha256-file artifacts/unihome-release.aab.sha256 \
            --metadata artifacts/release-metadata.json \
            --expected-version-code "$EXPECTED_VERSION_CODE"
          if test -f android/app/build/outputs/mapping/release/mapping.txt; then
            cp android/app/build/outputs/mapping/release/mapping.txt artifacts/mapping.txt
          fi
          if test -f android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip; then
            cp android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip artifacts/native-debug-symbols.zip
          fi
          {
            echo "### AAB release firmado"
            echo "- Tamaño: $(stat -c '%s' artifacts/unihome-release.aab) bytes"
            echo "- SHA256: $(cut -d' ' -f1 artifacts/unihome-release.aab.sha256)"
            echo "- versionCode: $(node -p "require('./app.json').expo.android.versionCode")"
            echo "- Firma: upload key del environment protegido. **No publica por sí solo.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar AAB y metadatos para promoción
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unihome-release-aab
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Borrar keystore temporal siempre
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/unihome-upload.jks"
          test ! -e "${RUNNER_TEMP}/unihome-upload.jks"
