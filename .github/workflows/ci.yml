name: CI UniHome Mobile

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-movil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Análisis Estático y Tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Instalar dependencias con lockfile
        run: npm ci --legacy-peer-deps
      - name: Verificación estática TypeScript (App)
        run: npx tsc --noEmit
      - name: Verificación estática TypeScript (Tests)
        run: npx tsc --project __tests__/tsconfig.json --noEmit

  security-tests:
    name: Pruebas de Seguridad y Cobertura
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Instalar dependencias con lockfile
        run: npm ci --legacy-peer-deps
      - name: Pruebas unitarias de seguridad Jest con cobertura
        run: npm run test:security -- --ci --coverage
      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  dependency-scan:
    name: Auditoría de Dependencias (SCA)
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Instalar dependencias con lockfile
        run: npm ci --legacy-peer-deps
      - name: Escaneo de vulnerabilidades npm audit
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Gitleaks - Detección de Secretos
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks CLI (fijado por versión y checksum SHA256)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Escanear historial completo del repositorio
        run: |
          set -euo pipefail
          ./gitleaks detect \
            --source . \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            -v
      - name: Subir reporte de Gitleaks como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

  security-scan:
    name: CodeQL - SAST JavaScript y TypeScript
    needs: static-analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analizar código con CodeQL
        uses: github/codeql-action/analyze@v3

  build-check:
    name: Verificación de Empaquetado (Dry-Run)
    needs: [static-analysis, security-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Instalar dependencias con lockfile
        run: npm ci --legacy-peer-deps
      - name: Expo export dry-run (verificar empaquetado sin firma)
        run: npx expo export --no-bytecode
