name: Vigilancia de Seguridad Programada

on:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scheduled
  cancel-in-progress: true

jobs:
  dependency-watch:
    name: SCA y SBOM semanales
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node fijado por .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias con lockfile
        run: npm ci --legacy-peer-deps
      - name: Auditar dependencias y generar SBOM
        run: |
          set -euo pipefail
          mkdir -p reports
          npm audit --json > reports/npm-audit-weekly.json || true
          node scripts/check-npm-audit.mjs reports/npm-audit-weekly.json
          npm sbom --sbom-format=cyclonedx --omit=dev > reports/sbom-weekly.cdx.json
          node scripts/verify-sbom.mjs reports/sbom-weekly.cdx.json
      - name: Publicar reportes semanales
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-security-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14
